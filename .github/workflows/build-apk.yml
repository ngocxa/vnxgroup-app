name: Build Android APK

on:
  push:
    paths:
      - 'android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          rm -rf android
          unzip -q -o android.zip
          ls -R android | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VNXGroup.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VNXGroup-apk
          path: VNXGroup.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VNXGroup App 1.0.${{ github.run_number }}
          body: "Tải file VNXGroup.apk bên dưới để cài app VNXGroup trên điện thoại Android."
          files: VNXGroup.apk
          make_latest: true
