<style>
:root{--navy:#14234b;--navy2:#1e3a8a;--gold:#d4a537;--gold2:#f3d27a;--rose:#c2185b;--bg:#faf7f0;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#ebe4d4;--shadow:0 6px 20px rgba(20,35,75,.08);--ff:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--fh:'Playfair Display',Georgia,serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html[data-theme=dark]{--bg:#0e1322;--card:#171f35;--text:#e8eaf1;--muted:#9ba4b8;--line:#263052;--shadow:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--ff);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.shell{max-width:680px;margin:0 auto;min-height:100vh;position:relative}

/* thanh trên */
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 16px 10px;background:linear-gradient(135deg,#14234b,#1e3a8a 65%,#3b2a6b);color:#fff;box-shadow:0 6px 20px rgba(20,35,75,.25)}
.appbar img{width:46px;height:46px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.ab-t{flex:1;min-width:0;line-height:1.15}
.ab-t b{font:800 21px var(--fh)}.ab-t b i{font-style:normal;color:var(--gold2)}
.ab-t small{display:block;font-size:11.5px;color:#cdd5ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:17px}
.ab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

main{padding:16px 16px calc(96px + var(--sb))}

/* tab dưới */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));width:calc(100% - 20px);max-width:660px;z-index:40;display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(20,35,75,.22);padding:6px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:16px;transition:.2s}
.tabbar em{font-style:normal;font-size:21px;line-height:1.15;transition:transform .2s}
.tabbar a.on{color:var(--rose);background:rgba(194,24,91,.09)}
.tabbar a.on em{transform:translateY(-2px) scale(1.12)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#14234b,#2a1f5c 55%,#5b1640);box-shadow:0 16px 40px rgba(20,35,75,.25)}
.hero:before{content:'\271D';position:absolute;right:-6px;top:-40px;font:200px/1 serif;color:rgba(255,255,255,.05)}
.hero.live{box-shadow:0 0 0 3px rgba(239,68,68,.55),0 16px 40px rgba(20,35,75,.25)}
.eyebrow{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--gold2);background:rgba(243,210,122,.14);border:1px solid rgba(243,210,122,.35);padding:4px 12px;border-radius:999px}
.hero h1{font:800 26px/1.2 var(--fh);margin:12px 0 4px}
.hero h1 em{font-style:normal;color:var(--gold2)}
.cd-label{font-size:13.5px;color:#d6dcf0;margin-bottom:10px}
.cd{display:flex;gap:8px}
.cd div{flex:1;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 0;text-align:center}
.cd b{display:block;font:800 30px/1 var(--fh);color:var(--gold2)}
.cd span{font-size:11.5px;color:#c3cbe4}
.mys{margin-top:12px;font-size:14px;font-weight:600;color:#fbcfe8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}

/* nút nhanh */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);color:var(--text)}
.q em{display:block;font-style:normal;font-size:24px;margin-bottom:2px}
.q.red{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;border:0}

/* chuyên mục */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.sec-h h2{font:800 21px/1.2 var(--fh);margin:0;display:flex;align-items:center;gap:9px}
.sec-h h2:before{content:'';width:5px;height:21px;border-radius:3px;background:linear-gradient(var(--gold),var(--rose))}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:999px;color:#fff;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 14px rgba(0,0,0,.12)}
.chip span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:20px;padding:14px;min-height:110px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 8px 20px rgba(0,0,0,.12)}
.tile .ti{position:absolute;top:10px;right:10px;font-size:30px}
.tile b{font-size:15px;line-height:1.25}.tile small{font-size:12px;opacity:.88;line-height:1.35}

/* danh sách bài */
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);transition:transform .15s}
.item:active{transform:scale(.98)}
.item .th{flex:none;width:108px;height:80px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#1e3a8a,#5b1640);display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:28px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.item .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.lab{font-size:11.5px;font-weight:700;color:var(--rose);text-transform:capitalize}
.item h3{margin:0;font-size:15px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dt{font-size:12px;color:var(--muted);margin-top:auto}
.item.big{flex-direction:column;padding:0;overflow:hidden}
.item.big .th{width:100%;height:auto;aspect-ratio:16/9;border-radius:0}
.item.big .tx{padding:4px 14px 14px}
.item.big h3{font:800 20px/1.3 var(--fh)}
.item.big p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:16px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.sk{background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;height:100px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.page-h{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--c1,#14234b),var(--c2,#1e3a8a));margin-bottom:16px;position:relative;overflow:hidden}
.page-h small{opacity:.85;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.page-h h1{margin:2px 0 0;font:800 24px/1.25 var(--fh);text-transform:capitalize}
.page-h .pi{position:absolute;right:14px;top:10px;font-size:44px;opacity:.9}

/* bài viết */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--rose);margin-bottom:10px;background:none;border:0;padding:4px 0;font-size:15px}
.post h1{font:800 26px/1.25 var(--fh);margin:6px 0 10px}
.cover{width:100%;border-radius:18px;margin:4px 0 14px;display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.meta span{background:var(--card);border:1px solid var(--line);padding:4px 11px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.entry{font-size:17.5px;line-height:1.8;overflow-wrap:break-word}
.entry *{max-width:100% !important}
.entry img{height:auto !important;border-radius:12px}
.entry iframe{width:100% !important;aspect-ratio:16/9;height:auto !important;border:0;border-radius:12px}
.entry a{color:var(--rose)}
.entry h1,.entry h2,.entry h3{font-family:var(--fh);line-height:1.3}
.entry blockquote{margin:16px 0;padding:12px 16px;border-left:4px solid var(--gold);background:rgba(212,165,55,.09);border-radius:0 12px 12px 0}
.entry pre{white-space:pre-wrap}
.entry table{display:block;overflow-x:auto}
.font-ctl{display:flex;gap:6px;margin-left:auto}
.font-ctl button{width:34px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:16px;font-weight:700;font-size:15px;border:0;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d05}
.btn.red{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.btn.line{background:var(--card);color:var(--text);border:1px solid var(--line)}

/* tìm kiếm */
.sbox{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);margin-bottom:16px}
.sbox input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--ff);color:var(--text);padding:8px 10px;outline:none}
.sbox button{border:0;border-radius:12px;padding:0 18px;font-weight:700;color:#fff;background:var(--navy2)}

/* trang Thêm */
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.box h3{margin:0 0 4px;font:800 18px var(--fh)}
.box p{margin:0 0 12px;color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-weight:600}
.row:last-child{border-bottom:0}
.row em{font-style:normal;font-size:20px;width:28px;text-align:center}
.row span{flex:1}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;border:0;transition:.2s;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--rose)}.sw.on:after{left:23px}
.ver{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}

/* thông báo nhỏ & hướng dẫn cài */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.install{display:none;align-items:center;gap:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d05;border-radius:18px;padding:12px 14px;margin-bottom:14px;font-weight:600;font-size:14px}
.install.show{display:flex}
.install b{display:block;font-size:15px}
.install button{margin-left:auto;border:0;border-radius:12px;padding:9px 14px;background:var(--navy);color:#fff;font-weight:700;flex:none}
.ios-tip{display:none}
.ios .ios-tip{display:block}

.guide{position:fixed;inset:0;z-index:80;background:rgba(10,15,30,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.25s}
.guide.show{opacity:1;visibility:visible}
.g-sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + var(--sb));transform:translateY(40px);transition:.3s;display:flex;flex-direction:column;gap:12px;text-align:left}
.guide.show .g-sheet{transform:none}
.g-sheet img{width:72px;height:72px;align-self:center}
.g-sheet h3{margin:0;text-align:center;font:800 21px var(--fh)}
.g-sheet p{margin:0;font-size:15px}
.g-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.g-steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.g-steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d05}
.kbd{display:inline-block;padding:0 7px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-weight:700}
.g-note{color:var(--muted);font-size:13.5px !important}
</style>
</head>

 {l:'giờ kinh tối',t:'Giờ kinh tối',e:'🕯️',d:'Kinh Mân Côi gia đình 19:45',c:['#312e81','#7c3aed']},
 {l:'lời chúa hằng ngày',t:'Lời Chúa hằng ngày',e:'📜',d:'Tin Mừng & lời cầu nguyện',c:['#92400e','#f59e0b']},
 {l:'chuỗi mân côi',t:'Chuỗi Mân Côi',e:'📿',d:'Lần hạt cùng Mẹ Maria',c:['#831843','#ec4899']},
 {l:'truyện tích',t:'Truyện tích',e:'📚',d:'100 truyện tích Mân Côi',c:['#7c2d12','#fb923c']},

 {l:'tuần cửu nhật',t:'Tuần cửu nhật',e:'🗓️',d:'Chín ngày cầu nguyện',c:['#1e3a8a','#60a5fa']},

 {l:'Góp nhặt',t:'Góp nhặt',e:'🧺',d:'Kiến thức hay, sức khỏe',c:['#c2410c','#fdba74']},
 {l:'video',t:'Video',e:'🎬',d:'Video giờ kinh & bài giảng',c:['#7f1d1d','#ef4444']}
];
var DAYS=['Chúa Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
var MYS=['Năm Sự Mừng','Năm Sự Vui','Năm Sự Thương','Năm Sự Mừng','Năm Sự Sáng','Năm Sự Thương','Năm Sự Vui'];
var d=document, view=d.getElementById('view'), mem={}, store={};
try{store=window.localStorage}catch(e){store={getItem:function(){return null},setItem:function(){}}}

function $(id){return d.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cat(l){l=(l||'').toLowerCase();for(var i=0;i<CATS.length;i++)if(CATS[i].l.toLowerCase()===l)return CATS[i];return null}

function p2(n){return(n<10?'0':'')+n}

function fmt(dt){return p2(dt.getDate())+'/'+p2(dt.getMonth()+1)+'/'+dt.getFullYear()}

/* ---------- Lấy dữ liệu từ Blogger (JSONP) ---------- */
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
function feed(path,params){
 return new Promise(function(res,rej){
  var q=['alt=json-in-script'];for(var k in params)q.push(k+'='+encodeURIComponent(params[k]));
  var base=BLOG+path+'?'+q.join('&'),cb='vnx_'+hash(base),s=d.createElement('script');
  var t=setTimeout(function(){done();rej(new Error('timeout'))},15000);
  function done(){clearTimeout(t);window[cb]=function(){};s.remove()}
  window[cb]=function(j){done();res(j)};
  s.onerror=function(){done();rej(new Error('net'))};
  s.src=base+'&callback='+cb;d.head.appendChild(s);

  h='<p>Trên máy tính dùng Chrome/Edge: bấm biểu tượng <b>Cài đặt ⊕</b> ở cuối thanh địa chỉ.</p><p>Để cài lên điện thoại, mở link này trên điện thoại:</p><button class="btn line" id="gCopy">🔗 Chép link app</button>';
 }
 var g=$('guide');
 if(!g){g=d.createElement('div');g.id='guide';g.className='guide';d.body.appendChild(g);g.addEventListener('click',function(e){if(e.target===g)closeGuide()})}
 g.innerHTML='<div class="g-sheet"><img src="icons/icon-192.png" alt=""><h3>'+t+'</h3>'+h+'<button class="btn" id="gClose">Đã hiểu</button></div>';
 $('gClose').onclick=closeGuide;
 var pw=$('gPwa');if(pw)pw.onclick=function(){if(deferred){deferred.prompt();deferred.userChoice.then(function(r){deferred=null;if(r&&r.outcome==='accepted')closeGuide()})}};
 var cp=$('gCopy');if(cp)cp.onclick=function(){var u=APPURL+'?install=1';if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('✅ Đã chép link')});else prompt('Chép link này:',u)};
 requestAnimationFrame(function(){g.classList.add('show')});
}
function closeGuide(){var g=$('guide');if(g)g.classList.remove('show')}
if(!standalone&&/[?&]install=1/.test(location.search))setTimeout(openGuide,1200);

/* ---------- Giao diện sáng / tối ---------- */
function setTheme(t){d.documentElement.setAttribute('data-theme',t);store.setItem('vnx-theme',t);$('themeBtn').textContent=t==='dark'?'☀️':'🌙';
 var m=d.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0e1322':'#14234b'}
setTheme(d.documentElement.getAttribute('data-theme')||'light');
$('themeBtn').onclick=function(){setTheme(d.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')};

/* ---------- Đồng hồ giờ kinh ---------- */
function tick(){
 var now=vnNow(),start=new Date(now.getTime());start.setHours(19,45,0,0);
 var end=new Date(start.getTime()+45*60000),live=now>=start&&now<end,target=now>=end?new Date(start.getTime()+86400000):start;
 var diff=Math.max(0,target-now),h=Math.floor(diff/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
 $('abSub').textContent=live?'🔴 Đang phát Giờ Kinh Tối – mời tham dự!':DAYS[now.getDay()]+', '+fmt(now)+' · Giờ kinh 19:45';
 /* nhắc khi đang mở app */
 var key=fmt(now);
 if(notifyOn()&&!live&&target===start&&diff<=5*60000&&store.getItem('vnx-noted')!==key){store.setItem('vnx-noted',key);showNote('🕯️ Sắp đến Giờ Kinh Tối','Còn 5 phút nữa – '+MYS[now.getDay()]+'. Chạm để tham dự.')}
 var hr=$('hero');if(!hr)return;
 hr.classList.toggle('live',live);
 $('cdLabel').innerHTML=live?'<i class="dot"></i> Đang phát trực tiếp – mời bạn tham dự!':(target===start?'Giờ kinh tối nay bắt đầu sau':'Giờ kinh tối mai bắt đầu sau');
 $('cdH').textContent=p2(live?0:h);$('cdM').textContent=p2(live?0:m);$('cdS').textContent=p2(live?0:s);
 var day=(live?now:target).getDay();$('cdMys').textContent='📿 '+MYS[day]+' – '+DAYS[day];
}
setInterval(tick,1000);

/* ---------- Điều hướng ---------- */
function route(){
 var h=location.hash.slice(1)||'/',parts=h.split('/'),a=parts[1]||'',b='';
 try{b=decodeURIComponent(parts.slice(2).join('/'))}catch(e){b=parts.slice(2).join('/')}
 var tab=a===''?'home':a==='label'?b:a==='more'?'more':'';
 d.querySelectorAll('#tabbar a').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-tab').toLowerCase()===tab.toLowerCase())});
 window.scrollTo(0,0);
 if(a==='label'&&b)label(b);else if(a==='post'&&b)postView(b);else if(a==='search')search(b);else if(a==='more')more();else if(a==='today')today();else home();
 tick();
}
window.addEventListener('hashchange',route);route();

if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
window.addEventListener('offline',function(){toast('📶 Đang mất mạng – bài đã xem vẫn đọc được')});
})();
</script>
